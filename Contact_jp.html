<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | Kohinn</title>

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>

<body class="commission-page">

<header class="mh-header">
  <div class="mh-container">

    <button class="mh-burger" id="burgerBtn">
      <span></span><span></span><span></span>
    </button>

    <div class="mh-logo">
      <a href="index_jp.html">Kohinn</a>
    </div>

    <div class="language-switch">
      <a href="contact_jp.html">JP</a> / <a href="contact.html">EN</a>
    </div>

    <nav class="mh-nav" id="navMenu">
      <ul>
        <li><a href="index_jp.html">Home</a></li>
        <li><a href="illustration_jp.html">Illustration</a></li>
        <li><a href="about_jp.html">About</a></li>
        <li><a href="commission_jp.html">Commission</a></li>
        <li><a href="contact_jp.html">Contact</a></li>
      </ul>
    </nav>

  </div>
</header>

<main>

<section class="mh-panel">
  <h2>Contact</h2>
  <p class="contact-intro">
    イラスト制作に関するご相談・ご依頼は、以下のフォームよりお気軽にお送りください。
  </p>

  <form action="https://formspree.io/f/meebdjlk" method="POST" class="contact-form">

    <label>お名前（任意）</label>
    <input type="text" name="name" placeholder="例：Kohinn">

    <label>メールアドレス（必須）</label>
    <input type="email" name="email" required placeholder="例：example@mail.com">

    <label>件名（任意）</label>
    <input type="text" name="subject" placeholder="例：イラスト依頼">

    <label>お問い合わせ内容（必須）</label>
    <textarea name="message" required placeholder="ご相談内容をご記入ください"></textarea>

    <button type="submit" class="mh-button">送信する</button>
  </form>
</section>
</main>

<footer class="footer-refined">
  <div class="footer-inner">

    <nav class="footer-nav">
      <a href="index_jp.html">Home</a>
      <a href="illustration_jp.html">Illustration</a>
      <a href="about_jp.html">About</a>
      <a href="commission_jp.html">Contact</a>
    </nav>

    <div class="footer-sns">
      <a href="https://twitter.com/V_Kohinn" target="_blank">X</a>
      <a href="https://bsky.app/profile/kohinnver2.bsky.social" target="_blank">Bluesky</a>
      <a href="https://www.pixiv.net/users/92080067" target="_blank">Pixiv</a>
      <a href="https://instagram.com/kohinn.ver2" target="_blank">Instagram</a>
      <a href="https://artstation.com/kohinn" target="_blank">ArtStation</a>
    </div>

    <p class="footer-copy">
      © 2025–2026 Kohinn. All rights reserved.
    </p>

  </div>
</footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const burger = document.getElementById("burgerBtn");
  const nav = document.getElementById("navMenu");

  burger.addEventListener("click", () => {
    burger.classList.toggle("active");
    nav.classList.toggle("active");
  });

  nav.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", () => {
      burger.classList.remove("active");
      nav.classList.remove("active");
    });
  });
});
</script>

</body>
</html>
