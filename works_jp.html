<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works | Kohinn</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <div class="logo"><a href="index_jp.html">Kohinn</a></div>

  <button class="menu-toggle" onclick="toggleMenu(this)">
    <span></span><span></span><span></span>
  </button>

  <nav id="main-nav" class="main-nav">
    <a href="index_jp.html">Home</a>
    <a href="works_jp.html">Works</a>
    <a href="about_jp.html">About</a>
    <a href="commission_jp.html">Commission</a>
  </nav>

  <!-- ★ 言語切り替えボタン（HOME と同じ配置） -->
  <div class="language-switch">
    <a href="works_jp.html" lang="ja">JP</a> / <a href="works.html" lang="en">EN</a>
  </div>
</header>

<main>

  <section id="works" class="portfolio-section fade-in">
    <h2>制作一覧</h2>

    <!-- 単一ギャラリー（全作品） -->
    <div class="works-grid" id="worksGrid">

      <!-- 旧アバター（オリジナル） -->
      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/sunaffy.webp"
           loading="lazy" alt="オリジナルキャラクター">

      <!-- 海外VTuber / ファンアートなど -->
      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト6ddd.webp"
           loading="lazy" alt="キャラクターイラスト">

      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト10jk.webp"
           loading="lazy" alt="キャラクターイラスト">

      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト4dzen.webp"
           loading="lazy" alt="キャラクターイラスト">

      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/o9klpl (1).webp"
           loading="lazy" alt="VTuberイラスト">

      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト98 (1).webp"
           loading="lazy" alt="キャラクターイラスト">

      <!-- 魔法科高校の劣等生 ファンアート -->
      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/miyuki3 (1).webp"
           loading="lazy" alt="魔法科高校の劣等生 ファンアート">

      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/siba_brlkj.webp"
           loading="lazy" alt="魔法科高校の劣等生 ファンアート">

    </div>
  </section>

</main>

<!-- Modal -->
<div id="modal" class="modal" aria-hidden="true">
  <button class="modal-close" aria-label="閉じる">✕</button>
  <img id="modal-img" class="modal-content" alt="">
</div>

<script>
/* ハンバーガー */
function toggleMenu(btn) {
  const nav = document.getElementById('main-nav');
  const isOpen = nav.classList.toggle('show');
  btn.classList.toggle('open', isOpen);
}

/* モーダル拡大 */
document.querySelectorAll('.works-grid img').forEach(img => {
  img.addEventListener('click', () => {
    document.getElementById('modal-img').src = img.src;
    document.getElementById('modal').classList.add('show');
    document.getElementById('modal').setAttribute('aria-hidden', 'false');
  });
});

document.querySelector('.modal-close').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modal').setAttribute('aria-hidden', 'true');
});

/* ランダム表示：ページ読み込み時に並び替え */
document.addEventListener('DOMContentLoaded', () => {
  const grid = document.getElementById('worksGrid');
  const items = Array.from(grid.children);

  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }

  items.forEach(item => grid.appendChild(item));
});
</script>

</body>
</html>
