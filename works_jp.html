<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works | Kohinn</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/works.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header">
  <div class="logo"><a href="index.html">Kohinn</a></div>

  <button class="hamburger" id="hamburger">
    <span></span><span></span><span></span>
  </button>

  <nav id="main-nav" class="main-nav">
    <a href="index.html">Home</a>
    <a href="works.html">Works</a>
    <a href="about.html">About</a>
    <a href="commission.html">Commission</a>
  </nav>

  <div class="language-switch">
    <a href="works_jp.html">JP</a> / <a href="works.html">EN</a>
  </div>
</header>

<main>

  <section id="works" class="portfolio-section fade-in">
    <h2>Works</h2>

    <div class="works-grid" id="worksGrid">
      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/sunaffy.webp" loading="lazy">
      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト6ddd.webp" loading="lazy">
      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト10jk.webp" loading="lazy">
      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト4dzen.webp" loading="lazy">
      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/o9klpl (1).webp" loading="lazy">
      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト98 (1).webp" loading="lazy">
      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/miyuki3 (1).webp" loading="lazy">
      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/siba_brlkj.webp" loading="lazy">
    </div>
  </section>

</main>

<!-- Modal -->
<div id="modal" class="modal" aria-hidden="true">
  <button class="modal-close" aria-label="Close">✕</button>
  <img id="modal-img" class="modal-content" alt="">
</div>

<script>
/* ハンバーガー */
const hamburger = document.getElementById('hamburger');
const nav = document.getElementById('main-nav');

hamburger.addEventListener('click', () => {
  hamburger.classList.toggle('active');
  nav.classList.toggle('show');
});

/* Modal */
document.querySelectorAll('.works-grid img').forEach(img => {
  img.addEventListener('click', () => {
    document.getElementById('modal-img').src = img.src;
    document.getElementById('modal').classList.add('show');
    document.getElementById('modal').setAttribute('aria-hidden', 'false');
  });
});

document.querySelector('.modal-close').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('show');
  document.getElementById('modal').setAttribute('aria-hidden', 'true');
});

/* Random shuffle（修正版） */
document.addEventListener('DOMContentLoaded', () => {
  const grid = document.getElementById('worksGrid');
  const items = Array.from(grid.children);

  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }

  items.forEach(item => grid.appendChild(item));
});
</script>

</body>
</html>
