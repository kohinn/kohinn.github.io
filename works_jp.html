<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works | Kohinn</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <div class="logo"><a href="index_jp.html">Kohinn</a></div>

  <button class="menu-toggle" onclick="toggleMenu(this)">
    <span></span><span></span><span></span>
  </button>

  <nav id="main-nav" class="main-nav">
    <a href="index_jp.html">Home</a>
    <a href="works_jp.html">Works</a>
    <a href="about_jp.html">About</a>
    <a href="commission_jp.html">Commission</a>
  </nav>
</header>

<main>

  <section id="works" class="portfolio-section fade-in">
    <h2>制作一覧</h2>

    <!-- フィルターボタン（2カテゴリ構成） -->
    <div class="filter-buttons">
      <button class="active" data-filter="all">All</button>
      <button data-filter="illustration">Character Illustrations</button>
      <button data-filter="fan">Fan Works</button>
    </div>

    <!-- 作品グリッド -->
    <div class="works-grid">

      <!-- Character Illustrations（旧アバターなど） -->
      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/sunaffy.webp"
           class="illustration"
           loading="lazy" alt="オリジナルキャラクター">

      <!-- Fan Works（海外VTuber / 魔法科） -->
      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト6ddd.webp"
           class="fan"
           loading="lazy" alt="ファンアート">

      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト10jk.webp"
           class="fan"
           loading="lazy" alt="ファンアート">

      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト4dzen.webp"
           class="fan"
           loading="lazy" alt="ファンアート">

      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/o9klpl (1).webp"
           class="fan"
           loading="lazy" alt="VTuberファンアート">

      <img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト98 (1).webp"
           class="fan"
           loading="lazy" alt="ファンアート">

    </div>
  </section>

</main>

<!-- Modal -->
<div id="modal" class="modal" aria-hidden="true">
  <button class="modal-close">✕</button>
  <img id="modal-img" class="modal-content" alt="">
</div>

<script>
/* ハンバーガー */
function toggleMenu(btn) {
  const nav = document.getElementById('main-nav');
  const isOpen = nav.classList.toggle('show');
  btn.classList.toggle('open', isOpen);
}

/* モーダル */
document.querySelectorAll('.works-grid img').forEach(img => {
  img.addEventListener('click', () => {
    document.getElementById('modal-img').src = img.src;
    document.getElementById('modal').classList.add('show');
  });
});

document.querySelector('.modal-close').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('show');
});

/* フィルタ */
const buttons = document.querySelectorAll('.filter-buttons button');
const images = document.querySelectorAll('.works-grid img');

buttons.forEach(btn => {
  btn.addEventListener('click', () => {
    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const filter = btn.dataset.filter;

    images.forEach(img => {
      if (filter === 'all' || img.classList.contains(filter)) {
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }
    });
  });
});
</script>

</body>
</html>
