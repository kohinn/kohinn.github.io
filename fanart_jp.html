<!-- Modal -->
<div id="modal" class="modal" aria-hidden="true">
  <button class="modal-close" aria-label="Close image">✕</button>
  <img class="modal-content" id="modal-img" alt="">
</div>

<a href="#" class="back-to-top" id="backToTop" aria-label="Back to top">↑</a>

<script>
function toggleMenu(btn) {
  const nav = document.getElementById('main-nav');
  const overlay = document.getElementById('navOverlay');
  const isOpen = nav.classList.toggle('show');
  btn.classList.toggle('open', isOpen);
  btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  overlay.classList.toggle('show', isOpen);
  document.body.classList.toggle('menu-open', isOpen);
}

document.addEventListener('DOMContentLoaded', () => {
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modal-img');
  const closeBtn = document.querySelector('.modal-close');
  const backToTop = document.getElementById('backToTop');
  let hideTimer;

  document.querySelectorAll('.gallery img').forEach(img => {
    img.addEventListener('click', () => {
      modalImg.src = img.src;
      modal.classList.add('show');
      modal.setAttribute('aria-hidden', 'false');
    });
  });

  closeBtn.addEventListener('click', () => {
    modal.classList.remove('show');
    modalImg.src = '';
    modal.setAttribute('aria-hidden', 'true');
  });

  window.addEventListener('scroll', () => {
    if (window.scrollY > 200) {
      backToTop.classList.add('show');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        backToTop.classList.remove('show');
      }, 1500);
    } else {
      backToTop.classList.remove('show');
    }
  });

  const fadeEls = document.querySelectorAll('.fade-in');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.1 });

  fadeEls.forEach(el => observer.observe(el));
});

  
// ===== Section Filter =====
document.querySelectorAll('.filter-buttons button').forEach(btn => {
  btn.addEventListener('click', () => {
    const filter = btn.dataset.filter;

    // active 切り替え
    document.querySelectorAll('.filter-buttons button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // セクション切り替え
    const sections = {
      vtuber: document.getElementById('vtuber'),
      anime: document.getElementById('anime'),
      original: document.getElementById('avatar')
    };

    if (filter === 'all') {
      Object.values(sections).forEach(sec => sec.style.display = 'block');
    } else {
      Object.entries(sections).forEach(([key, sec]) => {
        sec.style.display = (key === filter) ? 'block' : 'none';
      });
    }
  });
});


</script>
