<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css?v=20251129">
</head>
<body>

<header>
  <h1 class="site-logo">
    <a href="index_jp.html">
      <span class="site-subtitle">present by</span><br>
      <span class="site-main">Kohinn</span>
    </a>
  </h1>

  <button class="menu-toggle" aria-controls="main-nav" aria-expanded="false" onclick="toggleMenu(this)">
    <span></span><span></span><span></span>
  </button>

  <nav id="main-nav">
    <a href="fanart_jp.html">ファンアート</a>
    <a href="about_jp.html">アバウト</a>
    <a href="contact_jp.html">コンタクト</a>
  </nav>

  <div class="language-switch">
    <a href="index.html">EN</a> / <a href="index_jp.html">JP</a>
  </div>
</header>



<section id="fanart">
  <h2>Fanart</h2>
  <div class="gallery">
    <img class="thumbnail" src="hinaano_5.png" alt="Fanart 6">
    <img class="thumbnail" src="0f50e10c_original.jpg" alt="Fanart 1">
    <img class="thumbnail" src="cd350e62_original.jpg" alt="Fanart 2">
    <img class="thumbnail" src="o9klpl.jpg" alt="Fanart 3">
    <img class="thumbnail" src="イラスト98.jpg" alt="Fanart 4">
    <img class="thumbnail" src="melody.jpg" alt="Fanart 5">
  </div>
</section>

<footer>
  <div class="sns-links">
    <a href="https://twitter.com/V_Kohinn" target="_blank">X</a>

</footer>

<!-- モーダル拡大表示 -->
<div id="modal" class="modal" aria-hidden="true">
  <button class="modal-close" aria-label="Close image">✕</button>
  <img class="modal-content" id="modal-img" alt="">
</div>

<script>
function toggleMenu(btn) {
  const nav = document.getElementById('main-nav');
  const isOpen = nav.classList.toggle('show');
  btn.classList.toggle('open', isOpen);
  btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}

// モーダル表示
  document.addEventListener('DOMContentLoaded', () => {
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const closeBtn = document.querySelector('.modal-close');

    document.querySelectorAll('.gallery img').forEach(img => {
      img.addEventListener('click', () => {
        modalImg.src = img.src;
        modal.classList.add('show');
        modal.setAttribute('aria-hidden', 'false');
      });
    });

    closeBtn.addEventListener('click', () => {
      modal.classList.remove('show');
      modalImg.src = '';
      modal.setAttribute('aria-hidden', 'true');
    });
  });
</script>

</body>
</html>
