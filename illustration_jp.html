<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イラスト | Kohinn</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
</head>

<body>

<header class="mh-header">
  <div class="mh-container">

    <button class="mh-burger" id="burgerBtn">
      <span></span><span></span><span></span>
    </button>

    <div class="mh-logo">
      <a href="index_jp.html">kohinn</a>
    </div>

    <div class="language-switch">
      <a href="illustration_jp.html">JP</a> / <a href="illustration.html">EN</a>
    </div>

    <nav class="mh-nav" id="navMenu">
      <ul>
        <li><a href="index_jp.html">Home</a></li>
        <li><a href="illustration_jp.html">Illustration</a></li>
        <li><a href="about_jp.html">About</a></li>
        <li><a href="commission_jp.html">Commission</a></li>
      </ul>
    </nav>

  </div>
</header>

<script>
  const burger = document.getElementById("burgerBtn");
  const nav = document.getElementById("navMenu");
  burger.addEventListener("click", () => nav.classList.toggle("active"));
  nav.querySelectorAll("a").forEach(link => link.addEventListener("click", () => nav.classList.remove("active")));
</script>

<main>

  <section id="illustration" class="portfolio-section fade-in">
    <h2>Illustration</h2>

    <div class="illustration-grid" id="illustrationGrid">

      <div class="card"><img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/sunaffy.webp"></div>
      <div class="card"><img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト6ddd.webp"></div>
      <div class="card"><img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト10jk.webp"></div>
      <div class="card"><img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト4dzen.webp"></div>
      <div class="card"><img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/o9klpl (1).webp"></div>
      <div class="card"><img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/イラスト98 (1).webp"></div>
      <div class="card"><img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/miyuki3 (1).webp"></div>
      <div class="card"><img src="https://raw.githubusercontent.com/kohinn/kohinn-images/main/siba_brlkj.webp"></div>

    </div>
  </section>

</main>

<div id="modal" class="modal" aria-hidden="true">
  <button class="modal-close">✕</button>
  <img id="modal-img" class="modal-content">
</div>

<footer class="footer-refined">
  <div class="footer-inner">
    <nav class="footer-nav">
      <a href="index_jp.html">Home</a>
      <a href="illustration_jp.html">Illustration</a>
      <a href="about_jp.html">About</a>
      <a href="commission_jp.html">Commission</a>
    </nav>

    <div class="footer-sns">
      <a href="https://twitter.com/V_Kohinn" target="_blank">X</a>
      <a href="https://bsky.app/profile/kohinnver2.bsky.social" target="_blank">Bluesky</a>
      <a href="https://www.pixiv.net/users/92080067" target="_blank">Pixiv</a>
      <a href="https://instagram.com/kohinn.ver2" target="_blank">Instagram</a>
      <a href="https://artstation.com/kohinn" target="_blank">ArtStation</a>
    </div>

    <p class="footer-copy">© 2025–2026 Kohinn All rights reserved.</p>
  </div>
</footer>

<script>
document.querySelectorAll('.card img').forEach(img => {
  img.addEventListener('click', () => {
    document.getElementById('modal-img').src = img.src;
    document.getElementById('modal').classList.add('show');
  });
});
document.querySelector('.modal-close').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('show');
});
document.addEventListener('DOMContentLoaded', () => {
  const grid = document.getElementById('illustrationGrid');
  const items = Array.from(grid.children);
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  items.forEach(item => grid.appendChild(item));
});

    // 魔法科公式サイト風ハンバーガー開閉アニメーション
  document.addEventListener("DOMContentLoaded", () => {
    const burger = document.getElementById("burgerBtn");
    const nav = document.getElementById("navMenu");

    if (burger && nav) {
      burger.addEventListener("click", () => {
        burger.classList.toggle("active");
        nav.classList.toggle("active");
      });

      nav.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", () => {
          burger.classList.remove("active");
          nav.classList.remove("active");
        });
      });
    }
  });
</script>

</body>
</html>
